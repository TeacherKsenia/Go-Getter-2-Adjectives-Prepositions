.report .stats{max-width:550px;margin:0 auto;gap:22px}.report .stat{padding:9px 18px;background:#ffffff69}.report .stat b{font-size:clamp(27px,1.9vw,36px);line-height:1.3}.report .stat span{font-size:15px}
.report .screenshot-strip{width:fit-content;max-width:100%;gap:16px;margin:auto;align-self:center;justify-content:center}
.report .screenshot-camera{width:clamp(75px,7vw,130px);height:clamp(62px,5.5vw,100px);flex:0 0 auto}
.report .screenshot-reminder{font-size:clamp(19px,1.36vw,26px);line-height:1.35;max-width:48vw;text-align:center}
.report .mistakes-section{width:min(1240px,100%);margin:0 auto;min-height:0;gap:12px;align-self:stretch}
.report .mistakes-section h2{font-size:23px;margin:0;line-height:1.2}
.report .mistakes-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(var(--mistake-rows,2),minmax(0,1fr));gap:14px 20px;max-height:none;min-height:0;flex:1}
.report .mistake-card{background:#d4e7eaa6;border-radius:19px;padding:11px 13px;gap:8px;justify-content:center;min-width:0;min-height:0}
.report .mistake-card p{font-size:15px;line-height:1.3;gap:8px;overflow-wrap:anywhere}
@media(min-width:1101px) and (max-height:760px){#app>.report{padding:24px 26px 18px;grid-template-rows:minmax(145px,29%) minmax(65px,18%) minmax(0,1fr);gap:14px}.report .result-heading{padding-top:5px}.report .result-heading h1{font-size:clamp(28px,2.3vw,39px);margin:5px 0 12px}.report .result-target .celebrate-target{width:11vw;height:11vw}.report .stat{padding:5px 14px}.report .stat span{font-size:14px}.report .mistake-card p{font-size:14px;line-height:1.3}.report .mistake-card{padding:10px 12px;gap:7px}.report .mistakes-section h2{font-size:21px}}
@media(max-width:1100px){#app>.report{width:100%;padding:20px;grid-template-rows:145px 72px minmax(0,1fr);gap:14px}.report .result-hero{width:100%}.report .result-target .celebrate-target{width:130px;height:130px}.report .result-heading{padding-top:4px;width:70%;margin-left:auto;margin-right:0}.report .result-heading h1{font-size:28px;margin-bottom:12px}.report .screenshot-reminder{max-width:72%;font-size:19px}.report .screenshot-camera{width:65px;height:58px}.report .mistake-card p{font-size:14px}.report .mistakes-grid{gap:12px}.report .mistake-card{padding:10px}}
@media(max-width:760px){#app>.report{grid-template-rows:125px 64px minmax(0,1fr);padding:14px;gap:12px}.report .result-target .celebrate-target{width:80px;height:90px}.report .result-heading h1{font-size:23px;margin:4px 0 8px}.report .result-heading .eyebrow{font-size:10px}.report .stat b{font-size:23px}.report .stat span{font-size:12px}.report .stats{gap:8px}.report .stat{padding:4px}.report .screenshot-camera{width:38px;height:36px}.report .screenshot-reminder{font-size:16px}.report .mistakes-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}.report .mistakes-section h2{font-size:18px}.report .mistake-card{padding:8px;gap:5px}.report .mistake-card p{font-size:13px}}

 let cursor=q.chatLine+1;
 const reactions=[['Lucas','😂'],['Amy','🤦‍♀️'],['Elena','😆']];let reactionIndex=0;
 function finishConversation(){if(!valid())return;if(cursor<CHAT_MESSAGES.length){document.getElementById('phone-typing').hidden=false;setTimeout(()=>{if(!valid())return;const [n,t]=CHAT_MESSAGES[cursor++];history.innerHTML+=chatBubble(n,t);messengerTone('incoming');chatScroll();finishConversation();},1100);}else if(reactionIndex<reactions.length){document.getElementById('phone-typing').hidden=false;setTimeout(()=>{if(!valid())return;const [person,emoji]=reactions[reactionIndex++];history.innerHTML+=`<div class="friend-reaction" aria-label="${person} reacts to Tom’s message">${avatar(person,'chat-avatar')}<div class="reaction-bubble"><b>${person}</b><span>${emoji}</span></div></div>`;messengerTone('incoming');chatScroll();finishConversation();},900);}else{document.getElementById('phone-typing').hidden=true;history.innerHTML+='<p class="conversation-finished">Conversation complete</p>';chatScroll();document.getElementById('phone-footer').hidden=false;const nextButton=document.getElementById('next');nextButton.hidden=false;nextButton.disabled=false;nextButton.focus();}}

 finishConversation();
}
function finishUI(message,cl){const cue=document.getElementById('meaning-cue');if(cue)cue.hidden=true;document.getElementById('next').disabled=false;const current=TASKS[state.pos];if(current?.mission===0){const line=document.getElementById('chat-line-'+current.evidence);if(line)line.classList.add('evidence');}const f=document.getElementById('feedback');f.className='feedback '+cl;f.innerHTML=(current?.mission===1&&cl==='ok'?`<img class="feedback-emotion" src="${ASSETS[current.emotion]}" alt="">`:'')+message;document.getElementById('check').hidden=true;document.getElementById('next').hidden=false;document.querySelectorAll('.option').forEach(b=>b.disabled=true);const input=document.getElementById('answer');if(input)input.disabled=true;document.getElementById('next').textContent=state.pos===TASKS.length-1?'View result':'Next';document.getElementById('next').focus();}
function check(){checkContent();unlockDevNext();}
function checkContent(){if(locked)return;const q=TASKS[state.pos];const input=document.getElementById('answer');const value=q.options?selected:input.value.trim();const f=document.getElementById('feedback');if(!value){f.className='feedback try';f.textContent='Choose or type an answer first.';return;}const correct=isCorrect(q,value);tries++;attempts.push({answer:value,correct});state.pending={id:q.id,attempts};state.answerAttempts=state.answerAttempts||{};state.answerAttempts[q.id]=[...attempts];save();
 if(q.mission===5&&!correct){document.getElementById('next').disabled=true;f.className='feedback try';const hint=q.finalType==='correction'?(q.source.includes('about go')||q.source.includes('of clean')?'After a preposition, use verb + -ing.':'Check the preposition after the adjective.'):q.finalType==='form'?'Check both the preposition and the verb ending.':q.finalType==='preposition'?'Remember the adjective + preposition pair.':'Read the clues. How does the person feel?';f.textContent=tries<2?'Try again.':'Try again. Hint: '+hint;if(input){input.focus();input.select();}return;}
 if(q.mission===2&&!correct){messengerTone('incoming');f.hidden=false;f.textContent='Bot: I can’t send your message. Try again.';return;}
 if(q.mission!==5&&!correct){if(q.mission===1){revealMeaningEmotion();document.getElementById('next').disabled=true;}f.className='feedback try';if(q.mission===3){f.textContent='Try again.';document.getElementById('next').disabled=true;if(tries===2&&!state.dev)openDictionary();if(input){input.focus();input.select();}if(!document.getElementById('word-dictionary').hidden)document.getElementById('dictionary-close').focus();return;}f.textContent=q.mission===1?'Try again. Use the hint, then check your answer.':'Try again. '+(q.hint||(q.mission===0||q.mission===3?'Read the dialogue again.':'Read the situation again.'));if(input){input.focus();input.select();}return;}
 state.records.push({id:q.id,mission:q.mission,category:q.category,prompt:q.prompt,source:q.source||'',firstAnswer:attempts[0].answer,firstCorrect:attempts[0].correct,attempts:[...attempts],correctAnswer:q.answer});state.pending=null;save();locked=true;if(q.mission===2){completePhoneMessage(q);return;}if(q.taskType==='sort'){completeSort(q);return;}
 finishUI(q.mission===5?'Answer saved.':correct?(q.display?`Yes! ${q.display}`:'Yes! '+esc(q.answer)+'.'):`Correct answer: ${q.display||esc(q.answer)}`,q.mission===5?'':correct?'ok':'try');
}
function next(){if(!state||!document.getElementById('word-dictionary').hidden||(!state.dev&&!locked))return;chatRenderToken++;const q=TASKS[state.pos];if(state.dev&&!state.records.some(r=>r.id===q.id)){const input=document.getElementById('answer'),value=q.options?selected:input?.value.trim(),history=[...(state.answerAttempts?.[q.id]||[])];if(value&&(!history.length||history.at(-1).answer!==value))history.push({answer:value,correct:isCorrect(q,value)});if(history.length)state.records.push({id:q.id,mission:q.mission,category:q.category,prompt:q.prompt,source:q.source||'',firstAnswer:history[0].answer,firstCorrect:history[0].correct,attempts:history,correctAnswer:q.answer});}const m=q.mission;state.pos++;state.pending=null;if(m<5&&TASKS[state.pos]?.mission!==m)state.completedMission=m;save();show();window.scrollTo({top:0,behavior:'instant'});}
function totals(records){const grouped={};for(const r of records){if(!grouped[r.category])grouped[r.category]={correct:0,total:0};grouped[r.category].total++;grouped[r.category].correct+=Number(r.firstCorrect);}return grouped;}
function cameraSVG(){return `<svg class="screenshot-camera" viewBox="0 0 120 90" fill="none" aria-hidden="true"><path d="M15 25h23l9-12h27l9 12h22a8 8 0 0 1 8 8v43a8 8 0 0 1-8 8H15a8 8 0 0 1-8-8V33a8 8 0 0 1 8-8Z" fill="#e2dcf3"/><path d="M15 25h23l9-12h27l9 12h22a8 8 0 0 1 8 8v43a8 8 0 0 1-8 8H15a8 8 0 0 1-8-8V33a8 8 0 0 1 8-8Z" stroke="#147d79" stroke-width="4"/><circle cx="60" cy="54" r="21" fill="#ffffffc9" stroke="#147d79" stroke-width="4"/><circle cx="60" cy="54" r="12" fill="#b1dcd5"/><circle cx="95" cy="36" r="4" fill="#147d79"/><path d="m17 7 6 6M8 18h9M32 1v9" stroke="#ac97db" stroke-width="4" stroke-linecap="round"/></svg>`;}
function answerSentence(q,value){if(q.finalType==='correction')return value;if(/_+/.test(q.prompt))return q.prompt.replace(/_+(?:\s+_+)*/g,()=>value);if(q.mission===0)return q.prompt.replace(/^Who is /,value+' is ').replace(/\?$/,'.');if(q.mission===1)return q.person+' is '+value+'.';return value;}
function underlineMistakes(wrong,right){const a=String(wrong).split(/\s+/),b=String(right).split(/\s+/),dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=norm(a[i])===norm(b[j])?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);const same=new Set(),missing=[];let i=0,j=0;while(i<a.length&&j<b.length){if(norm(a[i])===norm(b[j])){same.add(i);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else{missing.push(i);j++;}}while(j++<b.length)missing.push(a.length);let marked=a.map((w,k)=>same.has(k)?esc(w):'<u>'+esc(w)+'</u>');if(same.size===a.length&&missing.length)marked.splice(missing[0],0,'<u aria-label="Missing word">…</u>');return marked.join(' ');}
function mistakeCards(records){return records.filter(r=>!r.firstCorrect).slice(-8).map(r=>{const q=TASKS.find(q=>q.id===r.id);if(!q)return '';const wrong=answerSentence(q,r.firstAnswer),right=answerSentence(q,q.answer);return `<article class="mistake-card"><p class="mistake-wrong"><span aria-label="Incorrect">✗</span><span>${underlineMistakes(wrong,right)}</span></p><p class="mistake-right"><span aria-label="Correct">✓</span><span>${esc(right)}</span></p></article>`;}).join('');}
function report(){syncNav(false);document.getElementById('route-status').textContent='Missions complete · 6/6';const records=state.records,final=records.filter(r=>r.mission===5),fscore=final.filter(r=>r.firstCorrect).length,errors=records.filter(r=>!r.firstCorrect);app.innerHTML=`<section class="report glass"><div class="result-hero"><div class="result-target">${targetSVG(true)}</div><div class="result-heading"><div class="eyebrow">Final mission complete</div><h1>Well done, ${esc(state.name)}!</h1><div class="stats"><div class="stat"><b>6 / 6 ✓</b><span>Missions completed</span></div><div class="stat"><b>${fscore} / 16</b><span>Final test · first answers</span></div></div></div></div><div class="screenshot-strip">${cameraSVG()}<p class="screenshot-reminder">Take a screenshot of this result and send it to your teacher.</p>${cameraSVG()}</div><div class="mistakes-section"><h2>Mistakes report</h2>${errors.length?`<div class="mistakes-grid" style="--mistake-rows:${Math.ceil(Math.min(8,errors.length)/4)}">${mistakeCards(records)}</div>`:(records.length?'<p class="perfect-result">✓ No mistakes. Great work!</p>':'<p class="perfect-result">No answers recorded in Dev mode.</p>')}</div></section>`;}
function targetSVG(celebrate=false){return `<svg class="mission-target ${celebrate?'celebrate-target':''}" viewBox="0 0 160 160" fill="none" aria-hidden="true"><circle cx="75" cy="85" r="58" fill="#d9eee9"/><circle cx="75" cy="85" r="44" fill="#fff" fill-opacity=".9"/><circle cx="75" cy="85" r="30" fill="#b8addf"/><circle cx="75" cy="85" r="16" fill="#fff"/><circle cx="75" cy="85" r="7" fill="#147d79"/><path class="target-arrow" d="M75 85L131 29M115 29H131V45" stroke="#147d79" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>${celebrate?'<path class="target-spark" d="M20 20v12M14 26h12M133 108v12M127 114h12" stroke="#a494d8" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="73" r="4" fill="#e8b653"/><circle cx="35" cy="145" r="4" fill="#e8b653"/>':''}</svg>`;}
function missionDone(progress,m){return TASKS.filter(q=>q.mission===m).every(q=>progress?.records.some(r=>r.id===q.id));}
function missionComplete(m){chatRenderToken++;syncNav(false);document.getElementById('route-status').textContent=`Mission ${m+1}/6 · Complete`;app.innerHTML=`<div class="mission-victory glass"><div class="victory-art">${targetSVG(true)}${Array.from({length:12},(_,i)=>`<i class="confetti" style="--i:${i};--x:${(i*29)%100}%"></i>`).join('')}</div><p class="eyebrow">Great work!</p><h1>Mission ${m+1} complete!</h1><p class="muted">${m<4?'Your next mission is ready.':'You’re ready for the final mission!'}</p><button class="primary" id="mission-home">Back to missions</button></div>`;document.getElementById('mission-home').onclick=home;}

function summaryTable(records){return `<div class="tablewrap"><table><thead><tr><th>Skill</th><th>First answers</th></tr></thead><tbody>${Object.entries(totals(records)).map(([c,t])=>`<tr><td>${c}</td><td>${t.correct} / ${t.total}</td></tr>`).join('')}</tbody></table></div>`;}
function errorTable(records){return `<div class="tablewrap"><table><thead><tr><th>Task</th><th>First answer</th><th>Correct answer</th></tr></thead><tbody>${records.map(r=>`<tr><td><span class="small muted">Mission ${r.mission+1} · ${r.category}</span><br>${esc(r.prompt)}</td><td class="scorewrong">${esc(r.firstAnswer)}</td><td class="scoregood">${esc(r.correctAnswer)}</td></tr>`).join('')}</tbody></table></div>`;}
function reportHTML(){const final=state.records.filter(r=>r.mission===5);return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GG2 result — ${esc(state.name)}</title><style>body{font:16px/1.5 Segoe UI,Arial,sans-serif;color:#203349;max-width:1050px;margin:35px auto;padding:0 20px}h1{font-size:29px}h2{margin-top:30px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;vertical-align:top;border-bottom:1px solid #ddd;padding:10px 8px}.muted{color:#617084}.small{font-size:12px}.scorewrong{color:#9b4c3b}.scoregood{color:#147d79}.tablewrap{overflow:auto}@media print{body{margin:0;font-size:12px}tr{break-inside:avoid}}
/* Meaning practice: read first; reveal the visual cue only after checking. */
.speaking-card{max-width:960px;padding:28px 32px}
.spoken-row{gap:24px;align-items:center;margin:22px 0 24px}
.spoken-content{padding-top:0}
.speech{padding:18px 22px;background:rgba(255,255,255,.42)}
.speech .prompt{font-size:clamp(23px,2.1vw,27px);line-height:1.45;text-wrap:balance;font-weight:550}
.phrase-end{white-space:nowrap}
.speaking-card .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0;margin:0 0 12px 152px}
.speaking-card .option{min-width:0;background:#e2e8f8;color:#303f66;font-size:21px;font-weight:650;padding:16px 12px;box-shadow:0 4px 12px #34477712;border-radius:15px}
.speaking-card .option:hover:not(:disabled){background:#d5def5}
.speaking-card .option.selected{background:#c8e9e1;color:#125b53;box-shadow:inset 0 0 0 2px var(--accent)}
.speaking-card .option:disabled{opacity:1}
.meaning-response{display:flex;align-items:center;gap:12px;min-height:64px;margin-left:152px}
.meaning-response .speech-emotion{width:48px;height:48px;margin:0}
.speaking-card .feedback{margin:0;min-height:0}
@media(max-width:700px){.speaking-card{padding:22px 18px}.spoken-row{gap:14px;align-items:flex-start;margin:18px 0 22px}.speech{padding:12px 14px}.speech .prompt{font-size:21px}.speaking-card .options{margin-left:0;gap:8px}.speaking-card .option{font-size:18px;padding:15px 6px}.meaning-response{margin-left:0}.phrase-end{white-space:normal}}


.mission:not(:disabled){background:rgba(255,255,255,.88)}.mission:not(:disabled) .mission-num{color:var(--accent)}
</style><h1>GG2 Unit 3 · Preposition Missions</h1><p><b>Student:</b> ${esc(state.name)}<br><b>Started:</b> ${esc(new Date(state.started).toLocaleString())}<br><b>Completed:</b> ${esc(new Date(state.completed).toLocaleString())}</p><p>Scores count first answers. A correct answer is required to continue. In the final check, a hint appears after two incorrect attempts. This report records written practice, not speaking.</p><h2>Final check: ${final.filter(r=>r.firstCorrect).length} / ${final.length}</h2>${summaryTable(final)}<h2>Practice: first answers</h2>${summaryTable(state.records.filter(r=>r.mission!==5))}<h2>Full answer record</h2><div class="tablewrap"><table><thead><tr><th>Mission / skill</th><th>Task</th><th>First answer</th><th>Retry</th><th>Correct answer</th></tr></thead><tbody>${state.records.map(r=>`<tr><td>${r.mission+1} · ${esc(r.category)}</td><td>${r.source?esc(r.source)+'<br>':''}${esc(r.prompt)}</td><td class="${r.firstCorrect?'scoregood':'scorewrong'}">${r.firstCorrect?'✓':'✗'} ${esc(r.firstAnswer)}</td><td>${esc(r.attempts.slice(1).map(a=>a.answer).join(' → ')||'—')}</td><td>${esc(r.correctAnswer)}</td></tr>`).join('')}</tbody></table></div></html>`;}
function download(){const blob=new Blob([reportHTML()],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='GG2_Result_'+state.name.replace(/[^\p{L}\p{N}_-]/gu,'_')+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function syncNav(isHome=false){if(isHome)document.getElementById('route-status').textContent='';const backButton=document.getElementById('nav-back'),devButton=document.getElementById('dev-mode');if(backButton)backButton.disabled=isHome||!state;if(devButton){devButton.hidden=!isHome;devButton.textContent=devEnabled?'Dev mode: ON':'Dev mode';devButton.setAttribute('aria-pressed',devEnabled?'true':'false');}}
function openDevMission(m){if(!devEnabled)return;state={version:1,name:'Dev mode',dev:true,started:new Date().toISOString(),pos:TASKS.findIndex(q=>q.mission===m),intro:-1,records:[],pending:null,finished:false};show();window.scrollTo({top:0,behavior:'instant'});}
function closeDevGate(){document.getElementById('dev-gate').hidden=true;document.getElementById('dev-password').value='';document.getElementById('dev-mode').focus();}
function unlockDevMode(){const input=document.getElementById('dev-password');if(input.value!=='Al0ham0ra'){document.getElementById('dev-gate-error').textContent='Incorrect password.';input.value='';input.focus();return;}closeDevGate();devEnabled=true;home();}
function toggleDevMode(){if(state)return;if(devEnabled){devEnabled=false;home();return;}document.getElementById('dev-gate').hidden=false;document.getElementById('dev-password').value='';document.getElementById('dev-gate-error').textContent='';document.getElementById('dev-password').focus();}
function back(){home();window.scrollTo({top:0,behavior:'instant'});}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else{document.getElementById('nav-status').textContent='Use F11 to enter full screen.';}syncFullscreen();window.scrollTo({top:0,behavior:'instant'});}catch(e){document.getElementById('nav-status').textContent='Use F11 to enter full screen.';}}
function syncFullscreen(){const button=document.getElementById('fullscreen');if(button){button.textContent=document.fullscreenElement?'Exit full screen':'Full screen';button.setAttribute('aria-pressed',document.fullscreenElement?'true':'false');}}
window.GG2={tasks:TASKS,missions:MISSIONS,isCorrect,norm,reportHTML,answerSentence,underlineMistakes,mistakeCards,start,show,check,next,home,getState:()=>state,back,openMission,toggleDevMode,getDevMode:()=>devEnabled,toggleFullscreen};
document.getElementById('nav-back').onclick=back;
document.getElementById('fullscreen').onclick=toggleFullscreen;
document.getElementById('dev-mode').onclick=toggleDevMode;
document.getElementById('dev-unlock').onclick=unlockDevMode;
document.getElementById('dev-cancel').onclick=closeDevGate;
document.getElementById('dev-password').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();unlockDevMode();}if(e.key==='Escape')closeDevGate();};
if(document.addEventListener)document.addEventListener('fullscreenchange',syncFullscreen);
home();
})();
</script></body></html>
